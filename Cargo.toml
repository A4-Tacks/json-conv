[package]
name = "json-conv"
version = "0.1.0"
edition = "2024"

authors = ["A4-Tacks <wdsjxhno1001@163.com>"]
keywords = ["json", "convert", "json5", "hjson"]
description = "CLI tool, convert json, json5, hjson"

license = "MIT"
repository = "https://github.com/A4-Tacks/json-conv"

[dependencies]
fs-err = { version = "3.2.2", optional = true }
getopts-macro = { version = "0.2.3", optional = true }
json5 = "1.3.1"
serde = "1.0.229"
serde-hjson = "1.1.0"
serde_json = { version = "1.0.151", features = ["indexmap"] }
serde_json5 = "0.2.1"

[dev-dependencies]
diff = "0.1.13"
expect-test = "1.5.1"
serde = { version = "1.0.229", features = ["derive"] }
test-buffer = { version = "0.1.0", features = ["expect-test"] }

[features]
getopts-macro = ["dep:getopts-macro", "fs-err"]

[[bin]]
name = "json-conv"
path = "src/main.rs"
required-features = ["getopts-macro"]
