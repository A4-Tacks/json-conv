[package]
name = "json-conv"
version = "0.1.0"
edition = "2024"

[dependencies]
json5 = "1.3.1"
serde = "1.0.229"
serde-hjson = "1.1.0"
serde_json = { version = "1.0.151", features = ["indexmap"] }
serde_json5 = "0.2.1"

[dev-dependencies]
diff = "0.1.13"
expect-test = "1.5.1"
serde = { version = "1.0.229", features = ["derive"] }
test-buffer = { version = "0.1.0", features = ["expect-test"] }
